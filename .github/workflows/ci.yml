name: CI

on:
  push:
    branches: [main, "cursor/**", "ccr-**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:accuracy
      - run: npm run test:upload
      - run: npm run build
      - name: Engine + API tests against production server
        run: |
          npx next start -p 3000 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
          npm run test:engine
